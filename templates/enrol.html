{% extends "base.html" %}
{% block title %}Enrol {{ pupil.forename }} - Phil{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Enrol {{ pupil.forename }} {{ pupil.surname }}</h1>
  <form method="post" action="/mentor/enrol/{{ pupil.id }}">
    <div class="field">
      <label>Course</label>
      <select name="course_id" required aria-label="Choose a course">
        {% for c in courses %}<option value="{{ c.id }}">{{ '%02d'|format(c.module_number) }} - {{ c.title }}</option>{% endfor %}
      </select>
    </div>
    <button class="btn btn-primary" type="submit">Enrol</button>
  </form>
</div>
{% endblock %}
