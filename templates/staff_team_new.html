{% extends "base.html" %}
{% from "_icons.html" import icon_user_plus %}
{% block title %}Invite team member - Phil{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card" style="text-align:center;">
  <div class="icon-badge" style="background:var(--teal-light);">{{ icon_user_plus(color='var(--teal-darker)') }}</div>
  <h1>Invite a Phil team member</h1>
  <form method="post" action="/staff/team/new" style="text-align:left;">
    <div class="field"><label for="name">Name</label><input type="text" id="name" name="name" required></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
    <div class="field"><label for="password">Temporary password</label><input type="password" id="password" name="password" required minlength="8"></div>
    <button class="btn btn-primary" type="submit" style="width:100%;">Add to Phil team</button>
  </form>
</div>
{% endblock %}
