{% extends "base.html" %}
{% block title %}Change password - Phil{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card card-center">
  <h1>Change your password</h1>
  <p class="muted">Changing this signs you out on every other device, so anyone else signed in as you will need the new password.</p>
  <form method="post" action="/account/password" class="form-left">
    <div class="field"><label for="current_password">Current password</label><input type="password" id="current_password" name="current_password" required autocomplete="current-password"></div>
    <div class="field"><label for="new_password">New password</label><input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password"></div>
    <div class="field"><label for="confirm_password">Confirm new password</label><input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
