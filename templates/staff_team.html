{% extends "base.html" %}
{% block title %}Phil team - Phil{% endblock %}
{% block content %}
<p class="back-link"><a href="/staff">&larr; Phil staff</a></p>
<div class="page-header">
  <h1>Phil team</h1>
  <a class="btn btn-primary" href="/staff/team/new">+ Invite team member</a>
</div>
<div class="card">
  <table>
    <tr><th>Name</th><th>Email</th></tr>
    {% for t in team %}
    <tr><td><span class="avatar-row"><span class="avatar avatar-sm">{{ t.name[:1] }}</span>{{ t.name }}</span></td><td>{{ t.email }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
