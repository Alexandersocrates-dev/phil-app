{% extends "base.html" %}
{% block title %}Sign in - Phil{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in</h1>
  <p class="muted">Mentor, admin or parent/carer accounts all sign in here.</p>
  <form method="post" action="/login">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="muted" style="margin-top:16px;">No account yet? <a href="/signup">Get started</a></p>
</div>
{% endblock %}
