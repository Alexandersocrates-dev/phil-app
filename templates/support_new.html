{% extends "base.html" %}
{% block title %}Get support - Phil{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Get support</h1>
  <form method="post" action="/support/new">
    <div class="field"><label>Subject</label><input type="text" name="subject" required></div>
    <div class="field"><label>Message</label><textarea name="message" required></textarea></div>
    <button class="btn btn-primary" type="submit">Send</button>
  </form>
</div>
{% endblock %}
